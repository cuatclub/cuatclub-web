# CodeRabbit configuration
# https://docs.coderabbit.ai/reference/configuration

language: "en-US"

reviews:
  profile: "chill"
  high_level_summary: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main", "dev", "refactor"]
  path_filters:
    - "!**/*.lock"
    - "!**/dist/**"
    - "!**/node_modules/**"
  # path_instructions:
  #   - path: "src/api/**"
  #     instructions: "Focus on security, input validation และ error handling"
  #   - path: "**/*.test.ts"
  #     instructions: "ตรวจ edge cases และ mock completeness"

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/review-guidelines.md"

tools:
  eslint:
    enabled: true
  gitleaks:
    enabled: true
