name: Close linked issues

on:
  pull_request:
    types: [closed]

jobs:
  close-issues:
    if: >
      github.event.pull_request.merged == true &&
      (github.base_ref == 'dev' || github.base_ref == 'main' || github.base_ref == 'develop')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues referenced in PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const keywordPattern = /\b(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            const issueNumbers = new Set();

            for (const match of body.matchAll(keywordPattern)) {
              issueNumbers.add(Number(match[2]));
            }

            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: "closed",
                  state_reason: "completed",
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `Closed by #${context.payload.pull_request.number}.`,
                });
              } catch (error) {
                core.warning(`Failed to close issue #${issueNumber}: ${error.message}`);
              }
            }
